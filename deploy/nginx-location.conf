# Insert inside the existing sub2api-edge server block.
location ^~ /assets/calc-private/ { return 404; }
location = /api/calc/usage {
  include /usr/share/nginx/html/assets/calc-private/auth.conf;
  alias /usr/share/nginx/html/assets/calc-private/latest.json;
  default_type application/json;
  add_header Cache-Control "private, no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  limit_except GET { deny all; }
}
