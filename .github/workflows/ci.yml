name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test && python3 -m unittest discover -s tests -p 'test_*.py'

      # Production prerendering requires the private source key, held only by Vercel.
      - name: Compile production build
        run: npm run build -- --experimental-build-mode compile
